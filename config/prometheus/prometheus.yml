# Prometheus para el clúster PostgreSQL/Patroni.
# Nodo 3 permanece comentado hasta conocer su IP de Tailscale.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets:
          - 100.120.213.18:9187 # postgres_exporter - Nodo 1
          - 100.87.77.76:9187   # postgres_exporter - Nodo 2
          # - IP_NODO_3:9187    # postgres_exporter - Nodo 3
        labels:
          cluster: cluster_ha

  - job_name: nodes
    static_configs:
      - targets:
          - 100.120.213.18:9100 # node_exporter - Nodo 1
          - 100.87.77.76:9100   # node_exporter - Nodo 2
          # - IP_NODO_3:9100    # node_exporter - Nodo 3
        labels:
          cluster: cluster_ha
