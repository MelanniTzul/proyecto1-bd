# HAProxy para PostgreSQL gestionado por Patroni.
#
# Puertos publicados por HAProxy:
#   5000 -> escritura: solo el nodo que responda /primary
#   5001 -> lectura: nodos que respondan /replica
#   8404 -> estadisticas de HAProxy
#
# Nodo 3 se mantiene comentado hasta conocer su IP de Tailscale.

global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 5s

frontend postgres_write
    bind *:5000
    default_backend postgres_primary

backend postgres_primary
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2

    server node1 100.120.213.18:5432 check port 8008
    server node2 100.87.77.76:5432 check port 8008
    # server node3 IP_NODO_3:5432 check port 8008

frontend postgres_read
    bind *:5001
    default_backend postgres_replicas

backend postgres_replicas
    mode tcp
    option httpchk GET /replica
    http-check expect status 200
    balance roundrobin
    default-server inter 2s fall 3 rise 2

    server node1 100.120.213.18:5432 check port 8008
    server node2 100.87.77.76:5432 check port 8008
    # server node3 IP_NODO_3:5432 check port 8008

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
